<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admissions Analytics Dashboard</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.s1{position:sticky;left:0;background:#0f172a;z-index:5;min-width:150px}
.s2{position:sticky;left:150px;background:#0f172a;z-index:5;min-width:90px}
thead .s1,thead .s2{background:#020617;z-index:15}
input[type=date]{color-scheme:dark}
</style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useCallback}=React;
const SPREADSHEET_ID="1kJFF89tvgh8TKJwwwzZW9r5ZMdblZmt_UJi7do4AtuY";
const DEFAULT_URL="https://script.google.com/macros/s/AKfycbzcUCWJ50aqO1NIuze2bDrhJ8c231dQD6Sm0LjxnxRc_Mv99guU0bgxq5BEDD7St7wg/exec";
const REFRESH_MS=5*60*1000, PAGE=25;

/* ---------- helpers ---------- */
const clean=k=>String(k).toLowerCase().replace(/[^a-z0-9]/g,"");
// Normalise each row ONCE (fast): {n: cleanedKeys->value, o: original row}
const prep=rows=>(rows||[]).map(o=>{const n={};for(const k in o)n[clean(k)]=String(o[k]??"").trim();const a=(o.__a||Object.values(o)).map(v=>String(v??"").trim());return{n,o,a};});
const g=(r,keys)=>{for(const k of keys){const v=r.n[clean(k)];if(v)return v;}return "";};
const num=v=>{const x=parseFloat(String(v??"").replace(/[₹,%\s,]/g,""));return isNaN(x)?0:x;};
// Dates -> UTC day number (timezone safe). Sheet dates read as DD-MM-YYYY unless YYYY-MM-DD.
function day(raw){
  if(!raw)return null;const s=String(raw).trim();let m;
  if(m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/))return Date.UTC(+m[1],m[2]-1,+m[3]);
  if(m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/))return Date.UTC(+m[3],m[2]-1,+m[1]);
  const d=new Date(s);return isNaN(d)?null:Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
}
const fmtD=raw=>{const t=day(raw);if(t==null)return raw||"-";const d=new Date(t);return `${String(d.getUTCDate()).padStart(2,"0")}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${d.getUTCFullYear()}`;};
const iso=t=>new Date(t).toISOString().slice(0,10);
const todayIST=()=>{const d=new Date(Date.now()+5.5*3600e3);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());};
const pct=(a,b)=>b>0?a/b*100:null;

// Proper CSV parser (handles quoted commas and line breaks)
function parseCSV(t){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;else if(c===","){row.push(cur);cur="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>x!==""))rows.push(row);row=[];}
    else cur+=c;}
  row.push(cur);if(row.some(x=>x!==""))rows.push(row);
  if(rows.length<2)return[];const h=rows[0];
  return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>{let n=k||"col_"+(i+1);while(n in o)n+="_"+(i+1);o[n]=r[i]??"";});Object.defineProperty(o,"__a",{value:r});return o;});
}
async function fetchTab(name){
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`);
  if(!r.ok)throw new Error(`Tab "${name}" could not be read (HTTP ${r.status}). Check sharing settings.`);
  return parseCSV(await r.text());
}
function exportCSV(name,cols,rows){
  const esc=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const body=[cols.map(c=>esc(c.label)).join(","),...rows.map(r=>cols.map(c=>esc(r[c.k])).join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+body],{type:"text/csv"}));a.download=name+".csv";a.click();
}

/* ---------- calculation engine (indexed: one pass per sheet) ---------- */
const blank=()=>({dialed:0,connected:0,effective:0,talk:0,wh:0,wc:0,b2b:0,b2bc:0,ab:0,ac:0,enr:0,elig:0,fees:0,arpuS:0,arpuN:0,discS:0,discN:0});
function compute(raw,s,e){
  const inR=d=>d!=null?((s==null||d>=s)&&(e==null||d<=e)):(s==null&&e==null);
  const emps=raw.team.map(r=>({
    id:g(r,["Employee ID","EmployeeID","Emp ID","ID"]),name:g(r,["Employee Name","EmployeeName","Staff Name","Name"]),
    email:g(r,["CE Email","Mail ID","Email","CE Mail ID"]).toLowerCase(),user:g(r,["User / Calling Name","Calling Name","User"]).toLowerCase(),
    src:g(r,["Source Name","SourceName","Source"]).toLowerCase(),center:g(r,["Center Name","Center","CenterName"])||"Unassigned",row:r.o,s:blank()}));
  // identifier -> employee index; an identifier shared by 2 employees is ambiguous (-1) and never assigned
  const mk=f=>{const m=new Map();emps.forEach((x,i)=>{const k=f(x);if(!k)return;m.set(k,m.has(k)&&m.get(k)!==i?-1:i);});return m;};
  const byEmail=mk(x=>x.email),byUser=mk(x=>x.user),bySrc=mk(x=>x.src);
  const find=(v,...maps)=>{v=v.toLowerCase();for(const m of maps){if(m.has(v)){const i=m.get(v);return i<0?null:emps[i];}}return null;};
  const byId=mk(x=>x.id.toLowerCase());
  // last-resort lookup: any cell of the Team Details row (only when that value is unique to one employee)
  const anyMap=new Map();emps.forEach((x,i)=>Object.values(x.row).forEach(v=>{const k=String(v||"").trim().toLowerCase();if(k.length<3)return;anyMap.set(k,anyMap.has(k)&&anyMap.get(k)!==i?-1:i);}));
  const D={};const dg=n=>D[n]=D[n]||{total:0,matched:0,inRange:0,noDate:0,miss:new Set(),min:null,max:null};
  const note=(n,id,x,d)=>{const o=dg(n);o.total++;if(d==null)o.noDate++;else{o.min=o.min==null||d<o.min?d:o.min;o.max=o.max==null||d>o.max?d:o.max;}
    if(x){o.matched++;if(inR(d))o.inRange++;}else if(o.miss.size<8&&id)o.miss.add(id);};
  const L=String.fromCharCode;
  // strict column positions from the spec (A=0). Falls back to header name only if the row is shorter than the position.
  const pv=(r,i,keys)=>r.a.length>i?r.a[i]:g(r,keys);
  const F=(id,...m)=>find(id,...m,anyMap);
  // Calling Dump: counts are C-F; the date and user_id are in A/B, detected from the data
  const hdr=raw.calling.length?Object.keys(raw.calling[0].o).map(clean):[];
  let dI=hdr.findIndex(h=>h.includes("date")),uI=hdr.findIndex(h=>/^(userid|user|email|ceemail|employee|employeeid|mailid)/.test(h));
  const smp=raw.calling.find(r=>r.a[0]||r.a[1]);
  if(dI<0||(dI>=2&&dI<=5))dI=smp&&day(smp.a[0])!=null?0:1;
  if(uI<0||(uI>=2&&uI<=5)||uI===dI)uI=dI===0?1:0;
  dg("Calling Dump").info=`Using column ${L(65+dI)} as date and ${L(65+uI)} as user. Counts from C, D, E, F.`;
  raw.calling.forEach(r=>{
    const id=r.a[uI]||"",d=day(r.a[dI]),x=F(id,byEmail,byUser,byId);
    note("Calling Dump",id,x,d);if(!x||!inR(d))return;
    x.s.dialed+=num(r.a[2]);x.s.connected+=num(r.a[3]);x.s.effective+=num(r.a[4]);x.s.talk+=num(r.a[5]);});
  // Walkins: Edate=B, regno=D, user=G
  raw.walkins.forEach(r=>{
    const id=pv(r,6,["user"]),d=day(pv(r,1,["Edate"])),x=F(id,byUser,byEmail,byId);
    note("Walkins",id,x,d);if(!x||!inR(d))return;
    x.s.wh++;if(pv(r,3,["regno"]))x.s.wc++;});
  // B2B: CE Email=A, Form Filled Date=C, Conversion Check=D, Appointment Date=E
  raw.b2b.forEach(r=>{
    const id=pv(r,0,["CE Email"]),x=F(id,byEmail,byUser,byId);
    const f=day(pv(r,2,["Form Filled Date"])),ap=day(pv(r,4,["Appointment Date"]));note("B2B",id,x,f);if(!x)return;
    const yes=pv(r,3,["Conversion Check"]).toLowerCase()==="yes";
    if(inR(f)){x.s.b2b++;if(yes)x.s.b2bc++;}
    if(inR(ap)){x.s.ab++;if(yes)x.s.ac++;}});
  // Adm Details: joining_date=C, eligibility=J, status=K, source_name=L, free=O, arpu=P, arpu_check=Q, disc=R, Fees_Eligible=S
  raw.adm.forEach(r=>{
    const id=pv(r,11,["source_name"]),d=day(pv(r,2,["joining_date"])),x=F(id,bySrc);
    note("Adm Details",id,x,d);if(!x||!inR(d))return;
    x.s.enr++;if(pv(r,9,["eligibility_status"]).toLowerCase()==="eligible")x.s.elig++;
    if(pv(r,18,["Fees_Eligible"]).toLowerCase()==="eligible")x.s.fees++;
    const ok=pv(r,10,["ay27_enrollment_status"]).toLowerCase()!=="less than registration"&&pv(r,14,["free_admission"]).toLowerCase()!=="true";
    if(ok){x.s.discS+=num(pv(r,17,["disc"]));x.s.discN++;if(pv(r,16,["arpu_check"]).toLowerCase()==="yes"){x.s.arpuS+=num(pv(r,15,["arpu"]));x.s.arpuN++;}}});
  emps.diag=D;
  return emps;
}
const sumS=list=>list.reduce((a,x)=>{for(const k in a)a[k]+=x.s[k];return a;},blank());
const rates=s=>({wPct:pct(s.wc,s.wh),bPct:pct(s.b2bc,s.b2b),aPct:pct(s.ac,s.ab),ePct:pct(s.elig,s.enr),fPct:pct(s.fees,s.enr),arpu:s.arpuN?s.arpuS/s.arpuN:null,disc:s.discN?s.discS/s.discN:null});

/* ---------- column definitions ---------- */
const CNT=[["dialed","Dialed"],["connected","Connected"],["effective","Effective Connected"],["talk","Talk Time"],["wh","Walk-ins Handled"],["wc","Walk-ins Converted"],["WP","Walk-in Conv %"],["b2b","B2B Booked"],["b2bc","B2B Converted"],["BP","B2B Conv %"],["ab","Appts Booked"],["ac","Appts Converted"],["AP","Appt Conv %"],["enr","Students Enrolled"],["elig","Students Eligible"],["EP","Eligible %"],["fees","Fees Eligible"],["FP","Fees Eligible %"],["ARPU","ARPU"],["DISC","Avg Discount"]];
function prodRows(emps,type,days){
  const d=type==="avg"?days:1;
  return emps.map(x=>{const r=rates(x.s);const o={emp:x,"Employee Name":x.name,"Employee ID":x.id,"CE Email":x.email||"N/A","Center":x.center};
    CNT.forEach(([k,l])=>{o[l]=k==="WP"?r.wPct:k==="BP"?r.bPct:k==="AP"?r.aPct:k==="EP"?r.ePct:k==="FP"?r.fPct:k==="ARPU"?r.arpu:k==="DISC"?r.disc:x.s[k]/d;});return o;});
}
const fmtV=(v,l,type)=>{if(v==null)return"–";if(typeof v!=="number")return v;
  if(l.includes("%"))return v.toFixed(2)+"%";if(l==="ARPU")return"₹"+Math.round(v).toLocaleString("en-IN");
  if(l==="Avg Discount")return v.toFixed(2);return type==="avg"?v.toFixed(2):Math.round(v).toLocaleString("en-IN");};

/* ---------- UI primitives ---------- */
const Sel=({label,value,onChange,children,w})=>(<label className="block"><span className="block text-[11px] text-slate-400 mb-1">{label}</span>
  <select value={value} onChange={e=>onChange(e.target.value)} className={`bg-slate-950 border border-slate-800 rounded-md px-2.5 py-1.5 text-xs focus:outline-none focus:border-indigo-500 ${w||""}`}>{children}</select></label>);
const Kpi=({label,value,hint,tone})=>(<div title={hint} className="bg-slate-900 border border-slate-800 rounded-xl p-3.5">
  <div className="text-[11px] text-slate-400">{label}</div><div className={`text-xl font-semibold font-mono mt-1 ${tone||"text-white"}`}>{value}</div></div>);

function DataTable({cols,rows,fmt,name,onRow,stickyN=0,searchable=true}){
  const [q,setQ]=useState(""),[sort,setSort]=useState(null),[page,setPage]=useState(0);
  useEffect(()=>setPage(0),[rows,q,sort]);
  const view=useMemo(()=>{let r=rows;
    if(q.trim()){const t=q.toLowerCase();r=r.filter(x=>cols.some(c=>String(x[c.k]??"").toLowerCase().includes(t)));}
    if(sort){const{k,d}=sort;r=[...r].sort((a,b)=>{const x=a[k],y=b[k];if(x==null)return 1;if(y==null)return-1;
      return(typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),undefined,{numeric:true}))*d;});}
    return r;},[rows,q,sort,cols]);
  const pages=Math.max(1,Math.ceil(view.length/PAGE)),cur=view.slice(page*PAGE,page*PAGE+PAGE);
  return(<div className="space-y-2">
    <div className="flex items-center justify-between gap-3">
      {searchable?<input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search this table…" className="bg-slate-900 border border-slate-800 rounded-md px-3 py-1.5 text-xs w-64 focus:outline-none focus:border-indigo-500"/>:<span/>}
      <div className="flex items-center gap-3 text-xs text-slate-400"><span>{view.length.toLocaleString()} rows</span>
        <button onClick={()=>exportCSV(name,cols,view)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-md">Export CSV</button></div></div>
    <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-auto max-h-[60vh]">
      <table className="w-full text-xs text-left text-slate-300">
        <thead className="bg-slate-950 text-slate-400 sticky top-0 z-10"><tr>
          {cols.map((c,i)=><th key={c.k} onClick={()=>setSort(s=>s&&s.k===c.k?(s.d===1?{k:c.k,d:-1}:null):{k:c.k,d:1})}
            className={`p-2.5 font-medium whitespace-nowrap cursor-pointer hover:text-white select-none ${i<stickyN?"s"+(i+1):""}`}>
            {c.label}{sort&&sort.k===c.k?(sort.d===1?" ▲":" ▼"):""}</th>)}</tr></thead>
        <tbody className="divide-y divide-slate-800/60">
          {cur.map((r,ri)=><tr key={ri} className="hover:bg-slate-800/40">
            {cols.map((c,i)=><td key={c.k} onClick={i===0&&onRow?()=>onRow(r):undefined}
              className={`p-2.5 whitespace-nowrap ${i<stickyN?"s"+(i+1):""} ${i===0&&onRow?"text-indigo-300 cursor-pointer hover:underline font-medium":""} ${typeof r[c.k]==="number"?"font-mono":""}`}>
              {fmt?fmt(r[c.k],c.label):r[c.k]}</td>)}</tr>)}
          {!cur.length&&<tr><td colSpan={cols.length} className="p-8 text-center text-slate-500">No records match these filters. Widen the date range or clear a filter.</td></tr>}
        </tbody></table></div>
    <div className="flex items-center justify-end gap-2 text-xs text-slate-400">
      <button disabled={page===0} onClick={()=>setPage(p=>p-1)} className="px-2.5 py-1 rounded bg-slate-800 disabled:opacity-40">Prev</button>
      <span>Page {page+1} of {pages}</span>
      <button disabled={page>=pages-1} onClick={()=>setPage(p=>p+1)} className="px-2.5 py-1 rounded bg-slate-800 disabled:opacity-40">Next</button></div></div>);
}

/* ---------- pages ---------- */
function Productivity({emps,type,days,hasRange,onEmp}){
  const rows=useMemo(()=>prodRows(emps,type,days),[emps,type,days]);
  const cols=useMemo(()=>["Employee Name","Employee ID","CE Email","Center",...CNT.map(c=>c[1])].map(l=>({k:l,label:l})),[]);
  const T=sumS(emps),R=rates(T),d=type==="avg"?days:1,v=x=>type==="avg"?(x/d).toFixed(2):Math.round(x).toLocaleString("en-IN"),p=x=>x==null?"–":x.toFixed(2)+"%";
  const pre=type==="avg"?"Avg ":"Total ",suf=type==="avg"?" / day":"";
  return(<div className="space-y-4">
    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-2">
      <div><h2 className="text-sm font-semibold">{type==="avg"?"Average Productivity (per day)":"Overall Productivity (cumulative)"}</h2>
        <p className="text-xs text-slate-400">{type==="avg"?"Each count is divided by the inclusive number of days. Percentages, ARPU and discount use real totals and are not divided.":"Actual totals for the selected dates. Percentages use total numerator ÷ total denominator."}</p></div>
      {type==="avg"&&<span className="text-xs bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-full">Date difference = {days} day{days>1?"s":""}</span>}</div>
    {type==="avg"&&!hasRange&&<div className="text-xs text-amber-300 bg-amber-500/10 border border-amber-500/30 rounded-lg p-3">No date range selected, so the divisor is 1. Pick a start and end date for true daily averages.</div>}
    <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-3">
      <Kpi label={pre+"Dialed"+suf} value={v(T.dialed)}/><Kpi label={pre+"Connected"+suf} value={v(T.connected)}/>
      <Kpi label={pre+"Effective"+suf} value={v(T.effective)}/><Kpi label={pre+"Talk Time"+suf} value={v(T.talk)}/>
      <Kpi label={pre+"Walk-ins"+suf} value={v(T.wh)}/><Kpi label={pre+"Walk-ins Converted"+suf} value={v(T.wc)}/>
      <Kpi label={pre+"B2B Booked"+suf} value={v(T.b2b)}/><Kpi label={pre+"B2B Converted"+suf} value={v(T.b2bc)}/>
      <Kpi label={pre+"Appts Booked"+suf} value={v(T.ab)}/><Kpi label={pre+"Appts Converted"+suf} value={v(T.ac)}/>
      <Kpi label={pre+"Enrolled"+suf} value={v(T.enr)}/><Kpi label={pre+"Eligible"+suf} value={v(T.elig)}/>
      <Kpi label={pre+"Fees Eligible"+suf} value={v(T.fees)}/><Kpi label="Walk-in Conv %" value={p(R.wPct)} tone="text-emerald-400"/>
      <Kpi label="B2B Conv %" value={p(R.bPct)} tone="text-emerald-400"/><Kpi label="Appt Conv %" value={p(R.aPct)} tone="text-emerald-400"/>
      <Kpi label="Eligible %" value={p(R.ePct)} tone="text-indigo-300"/><Kpi label="Fees Eligible %" value={p(R.fPct)} tone="text-indigo-300"/>
      <Kpi label="ARPU" value={R.arpu==null?"–":"₹"+Math.round(R.arpu).toLocaleString("en-IN")} hint="Average over qualifying admission records"/>
      <Kpi label="Avg Discount" value={R.disc==null?"–":R.disc.toFixed(2)}/></div>
    <DataTable cols={cols} rows={rows} fmt={(x,l)=>fmtV(x,l,type)} name={type==="avg"?"average-productivity":"overall-productivity"} stickyN={2} onRow={r=>onEmp(r.emp)}/></div>);
}

// Generic raw-record page (Eligibility Dump / Not Converted Walkins)
function RawPage({title,rows,dateKeys,filters,onlyBlank,s,e,name}){
  const [sel,setSel]=useState({});
  const opts=useMemo(()=>filters.map(f=>[...new Set(rows.map(r=>g(r,f.keys)).filter(Boolean))].sort()),[rows,filters]);
  const data=useMemo(()=>rows.filter(r=>{
    if(onlyBlank&&g(r,["regno"]))return false;
    if(s!=null||e!=null){const d=day(g(r,dateKeys));if(d==null||(s!=null&&d<s)||(e!=null&&d>e))return false;}
    return filters.every(f=>!sel[f.label]||g(r,f.keys)===sel[f.label]);}),[rows,sel,s,e,onlyBlank,filters,dateKeys]);
  const headers=useMemo(()=>rows.length?Object.keys(rows[0].o):[],[rows]);
  const cols=headers.map(h=>({k:h,label:h}));
  const table=useMemo(()=>data.map(r=>{const o={...r.o};headers.forEach(h=>{if(/date/i.test(h))o[h]=fmtD(o[h]);});return o;}),[data,headers]);
  return(<div className="space-y-4">
    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap items-end gap-3">
      <h2 className="text-sm font-semibold mr-4 self-center">{title}</h2>
      {filters.map((f,i)=><Sel key={f.label} label={f.label} value={sel[f.label]||""} onChange={v=>setSel(x=>({...x,[f.label]:v}))} w="max-w-[170px]">
        <option value="">All</option>{opts[i].map(o=><option key={o}>{o}</option>)}</Sel>)}</div>
    {rows.length===0?<div className="text-xs text-slate-500 p-8 text-center">This sheet has no rows.</div>:<DataTable cols={cols} rows={table} name={name}/>}</div>);
}

const RANKS=[["Walk-in Conversion %",s=>s.wc,s=>s.wh,"Converted","Handled"],["B2B Conversion %",s=>s.b2bc,s=>s.b2b,"Converted","Booked"],
  ["Appointment Conversion %",s=>s.ac,s=>s.ab,"Converted","Booked"],["Students Enrolled",s=>s.enr,null],
  ["Students Eligible %",s=>s.elig,s=>s.enr,"Eligible","Enrolled"],["Fees Eligible %",s=>s.fees,s=>s.enr,"Fees Eligible","Enrolled"],
  ["Effective Connected",s=>s.effective,null],["Dialed Count",s=>s.dialed,null]];
function Rankings({emps,onEmp}){
  const [mi,setMi]=useState(0);const[label,num_,den,nl,dl]=RANKS[mi];
  const rows=useMemo(()=>{
    let list=emps.map(x=>({emp:x,n:num_(x.s),d:den?den(x.s):null}));
    if(den)list=list.filter(r=>r.d>0);
    list.forEach(r=>r.v=den?r.n/r.d*100:r.n);
    list.sort((a,b)=>b.v-a.v||(den?b.d-a.d:0));
    let rank=0,prev=null;list.forEach((r,i)=>{if(r.v!==prev){rank=i+1;prev=r.v;}r.rank=rank;});return list;},[emps,mi]);
  return(<div className="space-y-4">
    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap gap-2 items-center">
      {RANKS.map((r,i)=><button key={r[0]} onClick={()=>setMi(i)} className={`px-3 py-1.5 rounded-md text-xs ${i===mi?"bg-indigo-600 text-white":"bg-slate-800 text-slate-300 hover:bg-slate-700"}`}>{r[0]}</button>)}</div>
    <p className="text-xs text-slate-400">Ranked by <b className="text-slate-200">{label}</b>, highest first. Equal values share a rank. {den?"Employees with no "+dl.toLowerCase()+" records are not ranked.":""}</p>
    <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-auto max-h-[65vh]"><table className="w-full text-xs text-left">
      <thead className="bg-slate-950 text-slate-400 sticky top-0"><tr><th className="p-2.5">Rank</th><th className="p-2.5">Employee</th><th className="p-2.5">ID</th><th className="p-2.5">Center</th>
        {den&&<><th className="p-2.5">{nl}</th><th className="p-2.5">{dl} (sample)</th></>}<th className="p-2.5">{label}</th></tr></thead>
      <tbody className="divide-y divide-slate-800/60">{rows.map(r=><tr key={r.emp.id+r.emp.name} className={r.rank<=3?"bg-amber-500/5":""}>
        <td className="p-2.5 font-mono">{r.rank<=3?["🥇","🥈","🥉"][r.rank-1]+" ":""}#{r.rank}</td>
        <td className="p-2.5 text-indigo-300 cursor-pointer hover:underline" onClick={()=>onEmp(r.emp)}>{r.emp.name}</td>
        <td className="p-2.5 font-mono text-slate-400">{r.emp.id}</td><td className="p-2.5">{r.emp.center}</td>
        {den&&<><td className="p-2.5 font-mono">{r.n}</td><td className="p-2.5 font-mono">{r.d}</td></>}
        <td className="p-2.5 font-mono text-emerald-400">{den?r.v.toFixed(2)+"%":Math.round(r.v).toLocaleString("en-IN")}</td></tr>)}
        {!rows.length&&<tr><td colSpan={7} className="p-8 text-center text-slate-500">No employees have data for this metric in the selected range.</td></tr>}</tbody></table></div></div>);
}

function Bars({title,items,f}){
  const max=Math.max(1,...items.map(i=>i.v||0));
  return(<div className="bg-slate-900 border border-slate-800 rounded-xl p-4"><h3 className="text-xs font-semibold mb-3">{title}</h3>
    <div className="space-y-2">{items.map(i=><div key={i.l} className="flex items-center gap-2 text-[11px]">
      <span className="w-28 truncate text-slate-400" title={i.l}>{i.l}</span>
      <div className="flex-1 bg-slate-800 rounded h-2.5"><div className="bg-indigo-500 h-2.5 rounded" style={{width:`${(i.v||0)/max*100}%`}}/></div>
      <span className="w-16 text-right font-mono">{i.v==null?"–":f(i.v)}</span></div>)}</div></div>);
}
function Centers({emps,onEmp}){
  const rows=useMemo(()=>{const m={};emps.forEach(x=>(m[x.center]=m[x.center]||[]).push(x));
    return Object.entries(m).map(([c,l])=>{const s=sumS(l),r=rates(s);return{Center:c,Employees:l.length,Dialed:s.dialed,Connected:s.connected,Effective:s.effective,
      "Walk-ins":s.wh,"Walk-in Conv.":s.wc,"Walk-in %":r.wPct,"B2B Booked":s.b2b,"B2B Conv.":s.b2bc,"B2B %":r.bPct,"Appts":s.ab,"Appt Conv.":s.ac,"Appt %":r.aPct,
      Enrolled:s.enr,Eligible:s.elig,"Eligible %":r.ePct,"Fees Eligible":s.fees,"Fees %":r.fPct,ARPU:r.arpu,"Avg Discount":r.disc};});},[emps]);
  const cols=useMemo(()=>rows.length?Object.keys(rows[0]).map(k=>({k,label:k})):[],[rows]);
  const it=(k)=>rows.map(r=>({l:r.Center,v:r[k]}));const P=x=>x.toFixed(1)+"%";const N=x=>Math.round(x).toLocaleString("en-IN");
  return(<div className="space-y-4">
    <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-3">
      <Bars title="Student Enrollment" items={it("Enrolled")} f={N}/><Bars title="Walk-in Conversion %" items={it("Walk-in %")} f={P}/>
      <Bars title="B2B Conversion %" items={it("B2B %")} f={P}/><Bars title="Student Eligibility %" items={it("Eligible %")} f={P}/>
      <Bars title="Effective Connected" items={it("Effective")} f={N}/><Bars title="ARPU" items={it("ARPU")} f={x=>"₹"+N(x)}/></div>
    <DataTable cols={cols} rows={rows} name="center-performance" searchable={false} fmt={(v,l)=>v==null?"–":typeof v!=="number"?v:l.includes("%")?v.toFixed(2)+"%":l==="ARPU"?"₹"+N(v):l==="Avg Discount"?v.toFixed(2):N(v)}/>
    <p className="text-[11px] text-slate-500">Center percentages come from center totals, not an average of employee percentages. Click an employee in Productivity or Rankings to drill down.</p></div>);
}

function Drilldown({emp,days,onClose}){
  useEffect(()=>{const h=e=>e.key==="Escape"&&onClose();window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);},[]);
  const s=emp.s,r=rates(s),P=x=>x==null?"–":x.toFixed(2)+"%";
  const attrs=Object.entries(emp.row).filter(([k,v])=>v&&!/email|name|id$/i.test(k)).slice(0,6);
  return(<div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onClick={onClose}>
    <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-3xl max-h-[90vh] overflow-auto p-5 space-y-4" onClick={e=>e.stopPropagation()}>
      <div className="flex justify-between items-start"><div><h3 className="font-bold">{emp.name}</h3>
        <p className="text-xs text-slate-400">{emp.id} · {emp.center} · {emp.email||"No email mapped"}</p>
        <p className="text-[11px] text-slate-500 mt-1">{attrs.map(([k,v])=>k+": "+v).join(" · ")}</p></div>
        <button onClick={onClose} className="text-slate-400 hover:text-white text-lg px-2">✕</button></div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
        {[["Dialed",s.dialed],["Connected",s.connected],["Effective",s.effective],["Talk Time",s.talk],["Walk-ins",s.wh],["Walk-ins Conv.",s.wc],["Walk-in %",P(r.wPct)],
        ["B2B Booked",s.b2b],["B2B Conv.",s.b2bc],["B2B %",P(r.bPct)],["Appts",s.ab],["Appts Conv.",s.ac],["Appt %",P(r.aPct)],["Enrolled",s.enr],["Eligible",s.elig],["Eligible %",P(r.ePct)],
        ["Fees Eligible",s.fees],["Fees %",P(r.fPct)],["ARPU",r.arpu==null?"–":"₹"+Math.round(r.arpu).toLocaleString("en-IN")],["Avg Discount",r.disc==null?"–":r.disc.toFixed(2)],
        ["Dialed / day",(s.dialed/days).toFixed(2)],["Effective / day",(s.effective/days).toFixed(2)]].map(([l,v])=><Kpi key={l} label={l} value={typeof v==="number"?v.toLocaleString("en-IN"):v}/>)}</div></div></div>);
}

function Diag({raw,emps,setRange}){
  const D=emps.diag||{},sheets=[["Team Details",raw.team],["Calling Dump",raw.calling],["Walkins Handelded",raw.walkins],["B2b Booked",raw.b2b],["Adm Details",raw.adm]];
  const dk={"Calling Dump":"Calling Dump","Walkins Handelded":"Walkins","B2b Booked":"B2B","Adm Details":"Adm Details"};
  const blankId=f=>emps.filter(x=>!x[f]).length;
  return(<div className="space-y-4">
    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-xs text-slate-300 space-y-1">
      <h2 className="text-sm font-semibold text-white">Data check</h2>
      <p>Employees in Team Details: {emps.length}. Missing CE Email: {blankId("email")}, Calling Name: {blankId("user")}, Source Name: {blankId("src")}.</p>
      <p className="text-slate-400">If "Matched" is 0 the identifier in that sheet does not match Team Details. If "In range" is 0 but "Matched" is not, change the date range.</p></div>
    {sheets.map(([n,rows])=>{const d=D[dk[n]];return(<div key={n} className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-xs space-y-1.5">
      <div className="flex justify-between"><b className="text-white">{n}</b><span className="text-slate-400">{rows.length} rows</span></div>
      <div className="text-slate-400 break-words">Columns: {rows.length?Object.keys(rows[0].o).map((h,i)=>String.fromCharCode(65+i)+"="+h).join(" | "):"none (sheet empty or unreadable)"}</div>
      {d&&<><div>Matched to an employee: <b>{d.matched}</b> of {d.total} · In selected range: <b>{d.inRange}</b> · Missing/unreadable date: {d.noDate}</div>
        <div>Dates found: {d.min==null?"none":fmtD(iso(d.min))+" to "+fmtD(iso(d.max))}
          {d.min!=null&&<button onClick={()=>setRange(iso(d.min),iso(d.max))} className="ml-3 underline text-indigo-300">Use this range</button>}</div>
        {d.info&&<div className="text-slate-400">{d.info}</div>}
        {d.miss.size>0&&<div className="text-amber-300">Unmatched identifiers (sample): {[...d.miss].join(", ")}</div>}</>}</div>);})}</div>);
}

/* ---------- app ---------- */
const NAV=[["avg","Average Productivity"],["overall","Overall Productivity"],["elig","Eligibility Dump"],["nc","Not Converted Walk-ins"],["rank","Employee Rankings"],["center","Center Performance"],["diag","Data Check"]];
const ELIG_F=[{label:"Center",keys:["Center Name","Center"]},{label:"Class / Course",keys:["Primary Class Course","primary_class_course","Course"]},{label:"Eligibility",keys:["eligibility_status"]},{label:"Source",keys:["source_name"]},{label:"Fees Eligible",keys:["Fees_Eligible"]}];
const NC_F=[{label:"Center",keys:["Center Name","Center"]},{label:"User",keys:["user"]},{label:"En Class",keys:["En Class","Course"]}];

function App(){
  const [url,setUrl]=useState(()=>{try{return localStorage.getItem("APPS_SCRIPT_URL")||DEFAULT_URL}catch(e){return DEFAULT_URL}});
  const [tab,setTab]=useState("avg"),[loading,setLoading]=useState(true),[err,setErr]=useState(""),[raw,setRaw]=useState(null),[updated,setUpdated]=useState("");
  const [preset,setPreset]=useState("ALL"),[start,setStart]=useState(""),[end,setEnd]=useState("");
  const [center,setCenter]=useState("ALL"),[empSel,setEmpSel]=useState("ALL"),[q,setQ]=useState(""),[drill,setDrill]=useState(null);

  const applyPreset=useCallback(p=>{setPreset(p);const t=todayIST(),d=new Date(t);
    if(p==="MONTH"){setStart(iso(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)));setEnd(iso(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)));}
    else if(p==="LAST_30"){setStart(iso(t-29*864e5));setEnd(iso(t));}
    else if(p==="ALL"){setStart("");setEnd("");}},[]);
  

  const load=useCallback(async(silent)=>{
    if(!silent)setLoading(true);setErr("");
    try{
      let data=null;
      try{const r=await fetch(url);if(r.ok){const j=await r.json();if(j.success&&j.data)data=j.data;}}catch(e){}
      if(!data){const[t,c,w,b,a]=await Promise.all(["Team Details","Calling Dump","Walkins Handelded","B2b Booked","Adm Details"].map(fetchTab));
        data={teamDetails:t,callingDump:c,walkins:w,b2b:b,admDetails:a};}
      setRaw({team:prep(data.teamDetails),calling:prep(data.callingDump),walkins:prep(data.walkins),b2b:prep(data.b2b),adm:prep(data.admDetails)});
      setUpdated(new Date().toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata"})+" IST");
    }catch(e){setErr(e.message||"Could not load data.");}finally{setLoading(false);}
  },[url]);
  useEffect(()=>{load();const t=setInterval(()=>load(true),REFRESH_MS);return()=>clearInterval(t);},[load]);

  const s=start?day(start):null,e=end?day(end):null;
  const days=s!=null&&e!=null&&e>=s?Math.round((e-s)/864e5)+1:1;
  const all=useMemo(()=>raw?compute(raw,s,e):[],[raw,s,e]);
  const centers=useMemo(()=>[...new Set(all.map(x=>x.center))].sort(),[all]);
  const inCenter=useMemo(()=>center==="ALL"?all:all.filter(x=>x.center===center),[all,center]);
  const emps=useMemo(()=>{let l=inCenter;if(empSel!=="ALL")l=l.filter(x=>x.id===empSel);
    if(q.trim()){const t=q.toLowerCase();l=l.filter(x=>(x.name+x.id+x.email).toLowerCase().includes(t));}return l;},[inCenter,empSel,q]);
  const invalid=s!=null&&e!=null&&e<s;
  const showFilters=["avg","overall","rank","center"].includes(tab);

  return(<div className="flex h-screen overflow-hidden">
    <aside className="w-56 shrink-0 bg-slate-900 border-r border-slate-800 flex flex-col">
      <div className="p-4 border-b border-slate-800"><h1 className="font-bold text-sm">Admissions Dashboard</h1><p className="text-[11px] text-slate-400">Live from Google Sheets</p></div>
      <nav className="flex-1 p-2 space-y-1 text-xs overflow-y-auto">{NAV.map(([k,l])=>
        <button key={k} onClick={()=>setTab(k)} className={`w-full text-left px-3 py-2.5 rounded-lg ${tab===k?"bg-indigo-600/20 text-indigo-300 font-semibold border border-indigo-500/30":"text-slate-400 hover:bg-slate-800/60 border border-transparent"}`}>{l}</button>)}</nav>
      <div className="p-3 border-t border-slate-800"><button onClick={()=>{const u=prompt("Apps Script Web App URL:",url);if(u){try{localStorage.setItem("APPS_SCRIPT_URL",u)}catch(e){}setUrl(u);}}} className="w-full px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-md text-xs">API settings</button></div></aside>
    <main className="flex-1 flex flex-col overflow-hidden">
      <header className="bg-slate-900 border-b border-slate-800 p-3 flex flex-wrap items-end justify-between gap-3">
        <div className="flex flex-wrap items-end gap-3">
          <Sel label="Date range" value={preset} onChange={applyPreset}><option value="MONTH">This month</option><option value="LAST_30">Last 30 days</option><option value="ALL">All time</option><option value="CUSTOM" disabled>Custom</option></Sel>
          <label className="block"><span className="block text-[11px] text-slate-400 mb-1">Start</span><input type="date" value={start} onChange={x=>{setStart(x.target.value);setPreset("CUSTOM")}} className="bg-slate-950 border border-slate-800 rounded-md px-2 py-1 text-xs"/></label>
          <label className="block"><span className="block text-[11px] text-slate-400 mb-1">End</span><input type="date" value={end} onChange={x=>{setEnd(x.target.value);setPreset("CUSTOM")}} className="bg-slate-950 border border-slate-800 rounded-md px-2 py-1 text-xs"/></label>
          {showFilters&&<>
            <Sel label="Center" value={center} onChange={v=>{setCenter(v);setEmpSel("ALL")}}><option value="ALL">All centers</option>{centers.map(c=><option key={c}>{c}</option>)}</Sel>
            <Sel label="Employee" value={empSel} onChange={setEmpSel} w="max-w-[190px]"><option value="ALL">All employees</option>{inCenter.map(x=><option key={x.id+x.name} value={x.id}>{x.name} ({x.id})</option>)}</Sel>
            <label className="block"><span className="block text-[11px] text-slate-400 mb-1">Search</span><input value={q} onChange={x=>setQ(x.target.value)} placeholder="Name, ID or email" className="bg-slate-950 border border-slate-800 rounded-md px-2.5 py-1 text-xs w-36"/></label></>}</div>
        <div className="flex items-center gap-3 text-xs text-slate-400">{updated&&<span>Updated {updated}</span>}
          <button onClick={()=>load()} disabled={loading} className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-60 text-white px-3.5 py-1.5 rounded-md font-medium">{loading?"Loading…":"Refresh"}</button></div></header>
      <div className="flex-1 overflow-auto p-5 space-y-4">
        {invalid&&<div className="text-xs text-red-300 bg-red-500/10 border border-red-500/30 rounded-lg p-3">End date is before start date. Adjust the range to see results.</div>}
        {err&&<div className="text-xs text-red-300 bg-red-500/10 border border-red-500/30 rounded-lg p-3 flex justify-between items-center"><span>{err}</span><button onClick={()=>load()} className="underline ml-4">Retry</button></div>}
        {loading&&!raw?<div className="h-64 flex items-center justify-center text-xs text-slate-400">Loading Google Sheets data…</div>:raw&&<>
          {(tab==="avg"||tab==="overall")&&<Productivity emps={emps} type={tab} days={days} hasRange={s!=null&&e!=null} onEmp={setDrill}/>}
          {tab==="elig"&&<RawPage title="Eligibility Dump (Adm Details)" rows={raw.adm} dateKeys={["joining_date","Date"]} filters={ELIG_F} s={s} e={e} name="eligibility-dump"/>}
          {tab==="nc"&&<RawPage title="Not Converted Walk-ins (blank regno)" rows={raw.walkins} dateKeys={["Edate","Date"]} filters={NC_F} onlyBlank s={s} e={e} name="not-converted-walkins"/>}
          {tab==="rank"&&<Rankings emps={emps} onEmp={setDrill}/>}
          {tab==="center"&&<Centers emps={emps} onEmp={setDrill}/>}
          {tab==="diag"&&<Diag raw={raw} emps={all} setRange={(a,b)=>{setStart(a);setEnd(b);setPreset("CUSTOM");}}/>}</>}
      </div></main>
    {drill&&<Drilldown emp={drill} days={days} onClose={()=>setDrill(null)}/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
