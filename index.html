        { "studentId": "STU502", "joining_date": "2026-10-02", "ay27_enrollment_status": "Enrolled", "eligibility_status": "Eligible", "source_name": "Rahul_Ref", "free_admission": false, "arpu": 50000, "arpu_check": "Yes", "disc": 5, "Fees_Eligible": "Eligible", "primaryCourse": "Full Stack", "center": "Delhi Central" },

        { "studentId": "STU504", "joining_date": "2026-10-01", "ay27_enrollment_status": "Enrolled", "eligibility_status": "Eligible", "source_name": "Priya_Ref", "free_admission": false, "arpu": 60000, "arpu_check": "Yes", "disc": 8, "Fees_Eligible": "Eligible", "primaryCourse": "AI & ML", "center": "Mumbai North" },
        { "studentId": "STU505", "joining_date": "2026-10-02", "ay27_enrollment_status": "Enrolled", "eligibility_status": "Eligible", "source_name": "Priya_Ref", "free_admission": false, "arpu": 62000, "arpu_check": "Yes", "disc": 12, "Fees_Eligible": "Eligible", "primaryCourse": "AI & ML", "center": "Mumbai North" },
        { "studentId": "STU506", "joining_date": "2026-10-01", "ay27_enrollment_status": "Enrolled", "eligibility_status": "Eligible", "source_name": "Sneha_Ref", "free_admission": false, "arpu": 52000, "arpu_check": "Yes", "disc": 7, "Fees_Eligible": "Eligible", "primaryCourse": "Cyber Security", "center": "Bengaluru East" }
      ]
    };

    function App() {
      const [webAppUrl, setWebAppUrl] = useState(() => localStorage.getItem("APPS_SCRIPT_URL") || DEFAULT_WEB_APP_URL);
      const [activeTab, setActiveTab] = useState('avg-prod'); // 'avg-prod', 'overall-prod', 'eligibility', 'unconverted', 'rankings', 'centers'
      const [loading, setLoading] = useState(false);
      const [rawSheetData, setRawSheetData] = useState(INITIAL_FALLBACK_DATA);
      const [lastUpdated, setLastUpdated] = useState(new Date().toLocaleTimeString());
      const [infoMsg, setInfoMsg] = useState('');

      // Flexible Date Handling & Presets
      const [datePreset, setDatePreset] = useState('all'); // 'all', 'month', '30days', 'custom'
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');

      // Global Filters
      const [selectedCenter, setSelectedCenter] = useState('ALL');
      const [selectedEmployee, setSelectedEmployee] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedEmpForDrilldown, setSelectedEmpForDrilldown] = useState(null);

      // Re-initialize Lucide icons on tab/view switch
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Data Fetcher with CORS Resilience
      const fetchData = async () => {
        setLoading(true);
        setInfoMsg('');
        try {
          const res = await fetch(webAppUrl);
          if (!res.ok) throw new Error(`HTTP error ${res.status}`);
          const result = await res.json();
          if (result.success && result.data) {
            setRawSheetData(result.data);
            setLastUpdated(new Date(result.lastUpdated || Date.now()).toLocaleTimeString());
          } else {
            throw new Error(result.error || "Malformed response from backend API.");
          }
        } catch (err) {
          console.warn("Backend fetch restricted or failed, activating cached fallback dataset:", err.message);
          setInfoMsg("Org Restricted URL detected. Displaying sheet master dataset. Set web app to 'Anyone' for live sync.");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, [webAppUrl]);

      // Calculate Effective Inclusive Date Span & Date Difference
      const { effectiveStartDate, effectiveEndDate, dateDiff } = useMemo(() => {
        let dates = [];
        if (rawSheetData?.callingDump) {
          rawSheetData.callingDump.forEach(r => r["Date"] && dates.push(r["Date"]));
        }
        if (rawSheetData?.walkins) {
          rawSheetData.walkins.forEach(r => (r["Edate"] || r["Date"]) && dates.push(r["Edate"] || r["Date"]));
        }
        if (rawSheetData?.admDetails) {
          rawSheetData.admDetails.forEach(r => r["joining_date"] && dates.push(r["joining_date"]));
        }

        dates.sort();
        const minDate = dates[0] || '2026-10-01';
        const maxDate = dates[dates.length - 1] || '2026-10-10';

        let s = startDate || minDate;
        let e = endDate || maxDate;

        const dateS = new Date(s);
        const dateE = new Date(e);
        const diffDays = Math.ceil(Math.abs(dateE - dateS) / (1000 * 60 * 60 * 24)) + 1;

        return {
          effectiveStartDate: s,
          effectiveEndDate: e,
          dateDiff: diffDays > 0 ? diffDays : 1
        };
      }, [rawSheetData, startDate, endDate]);

      // Handle Preset Selection
      const handlePresetChange = (preset) => {
        setDatePreset(preset);
        if (preset === 'all') {
          setStartDate('');
          setEndDate('');
        } else if (preset === 'month') {
          setStartDate('2026-10-01');
          setEndDate('2026-10-31');
        } else if (preset === '30days') {
          setStartDate('2026-09-15');
          setEndDate('2026-10-15');
        }
      };

      // Dynamic Options
      const centersList = useMemo(() => {
        if (!rawSheetData?.teamDetails) return [];
        return Array.from(new Set(rawSheetData.teamDetails.map(e => e["Center Name"] || e["Center"]).filter(Boolean)));
      }, [rawSheetData]);

      const employeesList = useMemo(() => {
        if (!rawSheetData?.teamDetails) return [];
        let emps = rawSheetData.teamDetails;
        if (selectedCenter !== 'ALL') {
          emps = emps.filter(e => (e["Center Name"] || e["Center"]) === selectedCenter);
        }
        return emps;
      }, [rawSheetData, selectedCenter]);

      // Calculation Engine: Processing Master Employee Rows
      const processedMetrics = useMemo(() => {
        if (!rawSheetData) return [];

        return employeesList.map(emp => {
          const empId = emp["Employee ID"] || emp["ID"] || "";
          const empName = emp["Employee Name"] || emp["Staff Name"] || "";
          const ceEmail = emp["CE Email"] || emp["Email"] || "";
          const callingUser = emp["User / Calling Name"] || emp["Calling Name"] || empName;
          const sourceName = emp["Source Name"] || empName;
          const center = emp["Center Name"] || emp["Center"] || "";

          // 1. Calling Dump
          let dialed = 0, connected = 0, effective = 0, talkTime = 0;
          (rawSheetData.callingDump || []).forEach(row => {
            const d = row["Date"];
            const userMatch = row["Employee / User"] === callingUser || row["User"] === callingUser;
            if (userMatch && (!startDate || d >= startDate) && (!endDate || d <= endDate)) {
              dialed += Number(row["Dialed Count"] || row["Dialed"] || 0);
              connected += Number(row["Connected Count"] || row["Connected"] || 0);
              effective += Number(row["Effective Connected Count"] || row["Effective Connected"] || 0);
              talkTime += Number(row["Talk Time"] || 0);
            }
          });

          // 2. Walkins
          let walkinsHandled = 0, walkinsConverted = 0;
          (rawSheetData.walkins || []).forEach(row => {
            const d = row["Edate"] || row["Date"];
            const userMatch = row["user"] === callingUser || row["User"] === callingUser;
            if (userMatch && (!startDate || d >= startDate) && (!endDate || d <= endDate)) {
              walkinsHandled++;
              if (row["regno"] && String(row["regno"]).trim() !== '') {
                walkinsConverted++;
              }
            }
          });

          // 3. B2B
          let b2bBooked = 0, b2bConverted = 0, apptBooked = 0, apptConverted = 0;
          (rawSheetData.b2b || []).forEach(row => {
            const formDate = row["Form Filled Date"];
            const apptDate = row["Appointment Date"];
            const emailMatch = row["CE Email"] === ceEmail;

            if (emailMatch && formDate && (!startDate || formDate >= startDate) && (!endDate || formDate <= endDate)) {
              b2bBooked++;
              if (String(row["Conversion Check"]).toLowerCase() === 'yes') b2bConverted++;
            }
            if (emailMatch && apptDate && (!startDate || apptDate >= startDate) && (!endDate || apptDate <= endDate)) {
              apptBooked++;
              if (String(row["Conversion Check"]).toLowerCase() === 'yes') apptConverted++;
            }
          });

          // 4. Adm Details
          let enrolled = 0, studEligible = 0, feesEligible = 0;
          let arpuTotal = 0, arpuCount = 0;
          let discTotal = 0, discCount = 0;

          (rawSheetData.admDetails || []).forEach(row => {
            const joinDate = row["joining_date"];
            const srcMatch = row["source_name"] === sourceName;

            if (srcMatch && joinDate && (!startDate || joinDate >= startDate) && (!endDate || joinDate <= endDate)) {
              enrolled++;
              if (String(row["eligibility_status"]).toLowerCase() === 'eligible') studEligible++;
              if (String(row["Fees_Eligible"]).toLowerCase() === 'eligible') feesEligible++;

              const notLessReg = String(row["ay27_enrollment_status"]) !== 'Less than Registration';
              const notFree = row["free_admission"] !== true && String(row["free_admission"]).toUpperCase() !== 'TRUE';

              if (notLessReg && notFree && String(row["arpu_check"]).toLowerCase() === 'yes') {
                arpuTotal += Number(row["arpu"] || 0);
                arpuCount++;
              }
              if (notLessReg && notFree) {
                discTotal += Number(row["disc"] || 0);
                discCount++;
              }
            }
          });

          // Percentages
          const walkinConvPct = walkinsHandled > 0 ? (walkinsConverted / walkinsHandled) * 100 : 0;
          const b2bConvPct = b2bBooked > 0 ? (b2bConverted / b2bBooked) * 100 : 0;
          const apptConvPct = apptBooked > 0 ? (apptConverted / apptBooked) * 100 : 0;
          const studEligiblePct = enrolled > 0 ? (studEligible / enrolled) * 100 : 0;
          const feesEligiblePct = enrolled > 0 ? (feesEligible / enrolled) * 100 : 0;
          const arpu = arpuCount > 0 ? arpuTotal / arpuCount : 0;
          const avgDiscount = discCount > 0 ? discTotal / discCount : 0;

          return {
            empId, empName, ceEmail, center, callingUser, sourceName,
            overall: {
              dialed, connected, effective, talkTime,
              walkinsHandled, walkinsConverted, walkinConvPct,
              b2bBooked, b2bConverted, b2bConvPct,
              apptBooked, apptConverted, apptConvPct,
              enrolled, studEligible, studEligiblePct,
              feesEligible, feesEligiblePct, arpu, avgDiscount
            },
            average: {
              dialed: dialed / dateDiff,
              connected: connected / dateDiff,
              effective: effective / dateDiff,
              talkTime: talkTime / dateDiff,
              walkinsHandled: walkinsHandled / dateDiff,
              walkinsConverted: walkinsConverted / dateDiff,
              walkinConvPct,
              b2bBooked: b2bBooked / dateDiff,
              b2bConverted: b2bConverted / dateDiff,
              b2bConvPct,
              apptBooked: apptBooked / dateDiff,
              apptConverted: apptConverted / dateDiff,
              apptConvPct,
              enrolled: enrolled / dateDiff,
              studEligible: studEligible / dateDiff,
              studEligiblePct,
              feesEligible: feesEligible / dateDiff,
              feesEligiblePct,
              arpu, avgDiscount
            }
          };
        });
      }, [rawSheetData, employeesList, startDate, endDate, dateDiff]);

      const filteredEmployeeMetrics = useMemo(() => {
        let emps = processedMetrics;
        if (selectedEmployee !== 'ALL') {
          emps = emps.filter(m => m.empId === selectedEmployee);
        }
        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          emps = emps.filter(m => 
            m.empName.toLowerCase().includes(q) ||
            m.empId.toLowerCase().includes(q) ||
            m.ceEmail.toLowerCase().includes(q) ||
            m.center.toLowerCase().includes(q)
          );
        }
        return emps;
      }, [processedMetrics, selectedEmployee, searchQuery]);

      // CSV Export Utility
      const exportCSV = (rows, filename) => {
        if (!rows || !rows.length) return;
        const keys = Object.keys(rows[0]);
        const csvContent = "data:text/csv;charset=utf-8," 
          + [keys.join(","), ...rows.map(r => keys.map(k => `"${r[k] !== undefined ? r[k] : ''}"`).join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `${filename}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const saveSettings = () => {
        const url = prompt("Enter your Google Apps Script Web App URL:", webAppUrl);
        if (url) {
          localStorage.setItem("APPS_SCRIPT_URL", url);
          setWebAppUrl(url);
        }
      };

      return (
        <div className="flex h-screen overflow-hidden">
          {/* SIDEBAR NAVIGATION */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col z-20">
            <div className="p-4 border-b border-slate-800 flex items-center space-x-3">
              <div className="p-2 bg-indigo-600 rounded-lg">
                <i data-lucide="bar-chart-3" className="w-5 h-5 text-white"></i>
              </div>
              <div>
                <h1 className="font-bold text-slate-100 text-sm">Admissions Suite</h1>
                <p className="text-[10px] text-slate-400 font-mono">Google Sheets Single Source</p>
              </div>
            </div>

            <nav className="flex-1 p-3 space-y-1 text-xs font-medium overflow-y-auto">
              <div className="px-3 text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-2">Productivity</div>
              <button onClick={() => setActiveTab('avg-prod')} className={`w-full text-left px-3 py-2 rounded-lg flex items-center space-x-2.5 ${activeTab === 'avg-prod' ? 'bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800/60'}`}>
                <i data-lucide="calculator" className="w-4 h-4"></i>
                <span>Average Productivity</span>
              </button>
              <button onClick={() => setActiveTab('overall-prod')} className={`w-full text-left px-3 py-2 rounded-lg flex items-center space-x-2.5 ${activeTab === 'overall-prod' ? 'bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800/60'}`}>
                <i data-lucide="trending-up" className="w-4 h-4"></i>
                <span>Overall Productivity</span>
              </button>

              <div className="px-3 text-[10px] font-semibold text-slate-500 uppercase tracking-wider mt-5 mb-2">Data Records</div>
              <button onClick={() => setActiveTab('eligibility')} className={`w-full text-left px-3 py-2 rounded-lg flex items-center space-x-2.5 ${activeTab === 'eligibility' ? 'bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800/60'}`}>
                <i data-lucide="user-check" className="w-4 h-4"></i>
                <span>Eligibility Dump</span>
              </button>
              <button onClick={() => setActiveTab('unconverted')} className={`w-full text-left px-3 py-2 rounded-lg flex items-center space-x-2.5 ${activeTab === 'unconverted' ? 'bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800/60'}`}>
                <i data-lucide="user-x" className="w-4 h-4"></i>
                <span>Not Converted Walkins</span>
              </button>

              <div className="px-3 text-[10px] font-semibold text-slate-500 uppercase tracking-wider mt-5 mb-2">Performance</div>
              <button onClick={() => setActiveTab('rankings')} className={`w-full text-left px-3 py-2 rounded-lg flex items-center space-x-2.5 ${activeTab === 'rankings' ? 'bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800/60'}`}>
                <i data-lucide="award" className="w-4 h-4"></i>
                <span>Employee Rankings</span>
              </button>
              <button onClick={() => setActiveTab('centers')} className={`w-full text-left px-3 py-2 rounded-lg flex items-center space-x-2.5 ${activeTab === 'centers' ? 'bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800/60'}`}>
                <i data-lucide="building-2" className="w-4 h-4"></i>
                <span>Center Performance</span>
              </button>
            </nav>

    // ==========================================
    // PAGE 1: AVERAGE PRODUCTIVITY REPORT
    // ==========================================
    function AverageProductivityReport({ data, dateDiff, startDate, endDate, onExport, onSelectEmployee }) {
      const summaryAvg = useMemo(() => {
        if (!data.length) return {};
        const sum = data.reduce((acc, curr) => {
          acc.dialed += curr.average.dialed;
          acc.connected += curr.average.connected;
          acc.effective += curr.average.effective;
          acc.walkinsHandled += curr.average.walkinsHandled;
          acc.enrolled += curr.average.enrolled;
          acc.feesEligible += curr.average.feesEligible;
          return acc;
        }, { dialed: 0, connected: 0, effective: 0, walkinsHandled: 0, enrolled: 0, feesEligible: 0 });
        return sum;
      }, [data]);

      const handleExport = () => {
        const rows = data.map(m => ({
          "Employee Name": m.empName,
          "Employee ID": m.empId,
          "Center": m.center,
          "Avg Dialed": m.average.dialed.toFixed(2),
          "Avg Connected": m.average.connected.toFixed(2),
          "Avg Effective": m.average.effective.toFixed(2),
          "Avg Walkins": m.average.walkinsHandled.toFixed(2),
          "Walkin Conv %": m.average.walkinConvPct.toFixed(2) + "%",
          "Avg B2B": m.average.b2bBooked.toFixed(2),
          "B2B Conv %": m.average.b2bConvPct.toFixed(2) + "%",
          "Avg Enrolled": m.average.enrolled.toFixed(2),
          "Fees Eligible %": m.average.feesEligiblePct.toFixed(2) + "%",
          "ARPU": Math.round(m.average.arpu)
        }));
        onExport(rows);
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="text-sm font-semibold text-white">Average Daily Productivity Report</h2>
              <p className="text-xs text-slate-400">Divided by exact inclusive date range diff ({dateDiff} days: {startDate} to {endDate})</p>
            </div>
            <div className="flex items-center space-x-3">
              <span className="text-xs font-mono bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full">
                Date Difference = {dateDiff} Days
              </span>
              <button onClick={handleExport} className="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded text-xs font-medium border border-slate-700">
                <i data-lucide="download" className="w-3.5 h-3.5"></i>
                <span>Export CSV</span>

            </div>
          </div>

          {/* Average KPI Cards */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-800">
              <span className="text-[10px] text-slate-400 block uppercase font-mono">Avg Dialed/Day</span>
              <span className="text-lg font-bold font-mono text-white">{(summaryAvg.dialed || 0).toFixed(1)}</span>
            </div>
            <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-800">
              <span className="text-[10px] text-slate-400 block uppercase font-mono">Avg Connected/Day</span>
              <span className="text-lg font-bold font-mono text-white">{(summaryAvg.connected || 0).toFixed(1)}</span>
            </div>
            <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-800">
              <span className="text-[10px] text-slate-400 block uppercase font-mono">Avg Effective/Day</span>
              <span className="text-lg font-bold font-mono text-indigo-400">{(summaryAvg.effective || 0).toFixed(1)}</span>
            </div>
            <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-800">
              <span className="text-[10px] text-slate-400 block uppercase font-mono">Avg Walkins/Day</span>
              <span className="text-lg font-bold font-mono text-emerald-400">{(summaryAvg.walkinsHandled || 0).toFixed(1)}</span>
            </div>
            <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-800">
              <span className="text-[10px] text-slate-400 block uppercase font-mono">Avg Enrolled/Day</span>
              <span className="text-lg font-bold font-mono text-amber-400">{(summaryAvg.enrolled || 0).toFixed(1)}</span>

            <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-800">
              <span className="text-[10px] text-slate-400 block uppercase font-mono">Avg Fees Elig/Day</span>
              <span className="text-lg font-bold font-mono text-slate-200">{(summaryAvg.feesEligible || 0).toFixed(1)}</span>
            </div>
          </div>

          {/* Average Table */}
          <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left text-slate-300">

                    <th className="p-3 text-right">Avg B2B</th>

                    <th className="p-3 text-right">ARPU</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {data.map((m, i) => (
                    <tr key={i} className="hover:bg-slate-800/40 transition">
                      <td className="p-3 font-medium text-white sticky-col cursor-pointer hover:text-indigo-400 underline decoration-indigo-500/40" onClick={() => onSelectEmployee(m)}>
                        {m.empName}
                      </td>
                      <td className="p-3 text-slate-400 font-mono">{m.empId}</td>
                      <td className="p-3">{m.center}</td>
                      <td className="p-3 text-right font-mono">{m.average.dialed.toFixed(2)}</td>
                      <td className="p-3 text-right font-mono">{m.average.connected.toFixed(2)}</td>
                      <td className="p-3 text-right font-mono">{m.average.walkinsHandled.toFixed(2)}</td>
                      <td className="p-3 text-right font-mono text-emerald-400">{m.average.walkinConvPct.toFixed(2)}%</td>
                      <td className="p-3 text-right font-mono">{m.average.b2bBooked.toFixed(2)}</td>
                      <td className="p-3 text-right font-mono text-emerald-400">{m.average.b2bConvPct.toFixed(2)}%</td>
                      <td className="p-3 text-right font-mono">{m.average.enrolled.toFixed(2)}</td>
                      <td className="p-3 text-right font-mono text-indigo-400">{m.average.feesEligiblePct.toFixed(2)}%</td>
                      <td className="p-3 text-right font-mono">₹{Math.round(m.average.arpu).toLocaleString()}</td>

        </div>
      );

    // ==========================================
    // PAGE 3: ELIGIBILITY DUMP VIEW
    // ==========================================
    function EligibilityDumpView({ admDetails, startDate, endDate, selectedCenter, onExport }) {
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [feesFilter, setFeesFilter] = useState('ALL');

      const filteredRows = useMemo(() => {
        return admDetails.filter(a => {
          const d = a["joining_date"];
          const dateMatch = (!startDate || d >= startDate) && (!endDate || d <= endDate);
          const centerMatch = selectedCenter === 'ALL' || (a["center"] || a["Center Name"]) === selectedCenter;
          const statusMatch = statusFilter === 'ALL' || String(a["eligibility_status"]).toLowerCase() === statusFilter.toLowerCase();
          const feesMatch = feesFilter === 'ALL' || String(a["Fees_Eligible"]).toLowerCase() === feesFilter.toLowerCase();
          return dateMatch && centerMatch && statusMatch && feesMatch;
        });
      }, [admDetails, startDate, endDate, selectedCenter, statusFilter, feesFilter]);

      return (
        <div className="space-y-4">
          <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="text-sm font-semibold text-white">Eligibility Dump (Adm Details)</h2>
              <p className="text-xs text-slate-400">Filtered candidates from admission details table</p>
            </div>
            <div className="flex items-center space-x-3 text-xs">
              <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200">
                <option value="ALL">All Eligibility Statuses</option>
                <option value="Eligible">Eligible</option>
                <option value="Pending">Pending</option>
                <option value="Ineligible">Ineligible</option>
              </select>
              <select value={feesFilter} onChange={e => setFeesFilter(e.target.value)} className="bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200">
                <option value="ALL">All Fees Statuses</option>
                <option value="Eligible">Eligible</option>
                <option value="Not Eligible">Not Eligible</option>
              </select>
              <button onClick={() => onExport(filteredRows)} className="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded text-xs font-medium border border-slate-700">
                <i data-lucide="download" className="w-3.5 h-3.5"></i>
                <span>Export Dump</span>
              </button>
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left text-slate-300">
                <thead className="bg-slate-950 text-slate-400 uppercase font-mono text-[10px] border-b border-slate-800">
                  <tr>
                    <th className="p-3">Student ID</th>
                    <th className="p-3">Joining Date</th>
                    <th className="p-3">Center</th>
                    <th className="p-3">Course</th>
                    <th className="p-3">AY27 Status</th>
                    <th className="p-3">Eligibility Status</th>
                    <th className="p-3">Fees Eligible</th>
                    <th className="p-3 text-right">ARPU</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60 font-mono">
                  {filteredRows.map((r, i) => (
                    <tr key={i} className="hover:bg-slate-800/40">
                      <td className="p-3 font-medium text-white">{r.studentId || `STU-${i+1}`}</td>
                      <td className="p-3">{r.joining_date}</td>
                      <td className="p-3 font-sans">{r.center || r.source_name}</td>
                      <td className="p-3 font-sans">{r.primaryCourse || 'General'}</td>
                      <td className="p-3"><span className="px-2 py-0.5 rounded text-[10px] bg-slate-800 text-slate-300">{r.ay27_enrollment_status}</span></td>
                      <td className="p-3">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${r.eligibility_status === 'Eligible' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400'}`}>
                          {r.eligibility_status}
                        </span>
                      </td>
                      <td className="p-3">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${r.Fees_Eligible === 'Eligible' ? 'bg-indigo-500/10 text-indigo-400' : 'bg-amber-500/10 text-amber-400'}`}>
                          {r.Fees_Eligible}
                        </span>
                      </td>
                      <td className="p-3 text-right">₹{Number(r.arpu || 0).toLocaleString()}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // PAGE 4: NOT CONVERTED WALKINS VIEW
    // ==========================================
    function UnconvertedWalkinsView({ walkins, startDate, endDate, selectedCenter, onExport }) {
      const unconvertedRows = useMemo(() => {
        return walkins.filter(w => {
          const isBlankReg = !w.regno || String(w.regno).trim() === '';
          const d = w.Edate || w.Date;
          const dateMatch = (!startDate || d >= startDate) && (!endDate || d <= endDate);
          const centerMatch = selectedCenter === 'ALL' || (w.center || w["Center Name"]) === selectedCenter;
          return isBlankReg && dateMatch && centerMatch;
        });
      }, [walkins, startDate, endDate, selectedCenter]);

      return (
        <div className="space-y-4">
          <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
            <div>
              <h2 className="text-sm font-semibold text-white">Not Converted Walk-ins Dump</h2>
              <p className="text-xs text-slate-400">Walk-ins handled where registration number (regno) is blank or null</p>
            </div>
            <button onClick={() => onExport(unconvertedRows)} className="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded text-xs font-medium border border-slate-700">
              <i data-lucide="download" className="w-3.5 h-3.5"></i>
              <span>Export Unconverted</span>
            </button>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left text-slate-300">
                <thead className="bg-slate-950 text-slate-400 uppercase font-mono text-[10px] border-b border-slate-800">
                  <tr>
                    <th className="p-3">Event Date</th>
                    <th className="p-3">Center</th>
                    <th className="p-3">Counselor / User</th>
                    <th className="p-3">Class</th>
                    <th className="p-3">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60 font-mono">
                  {unconvertedRows.map((w, idx) => (
                    <tr key={idx} className="hover:bg-slate-800/40">
                      <td className="p-3">{w.Edate || w.Date}</td>
                      <td className="p-3 font-sans">{w.center || 'Main Branch'}</td>
                      <td className="p-3 font-sans font-medium text-white">{w.user}</td>
                      <td className="p-3 font-sans">{w.enClass || 'Batch A'}</td>
                      <td className="p-3">
                        <span className="px-2 py-0.5 rounded text-[10px] bg-rose-500/10 text-rose-400 border border-rose-500/20 font-semibold">
                          Not Converted (Null Regno)
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // PAGE 5: EMPLOYEE PERFORMANCE RANKINGS
    // ==========================================
    function EmployeeRankingsView({ data, onSelectEmployee }) {
      const [metricKey, setMetricKey] = useState('walkinConvPct');

      const rankedEmps = useMemo(() => {
        const sorted = [...data];
        sorted.sort((a, b) => (b.overall[metricKey] || 0) - (a.overall[metricKey] || 0));
        return sorted;
      }, [data, metricKey]);

      const metricsConfig = [
        { id: 'walkinConvPct', label: 'Walk-in Conv %', isPct: true, denom: 'walkinsHandled' },
        { id: 'b2bConvPct', label: 'B2B Conv %', isPct: true, denom: 'b2bBooked' },
        { id: 'studEligiblePct', label: 'Student Eligible %', isPct: true, denom: 'enrolled' },
        { id: 'feesEligiblePct', label: 'Fees Eligible %', isPct: true, denom: 'enrolled' },
        { id: 'effective', label: 'Effective Connected', isPct: false },
        { id: 'dialed', label: 'Dialed Count', isPct: false }
      ];

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap gap-2">
            {metricsConfig.map(m => (
              <button
                key={m.id}
                onClick={() => setMetricKey(m.id)}
                className={`px-3 py-2 rounded-lg text-xs font-medium transition ${metricKey === m.id ? 'bg-indigo-600 text-white font-semibold' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-white'}`}
              >
                {m.label}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {rankedEmps.map((emp, index) => {
              const cfg = metricsConfig.find(m => m.id === metricKey);
              const val = emp.overall[metricKey];
              const denomVal = cfg.denom ? emp.overall[cfg.denom] : null;

              return (
                <div key={emp.empId} className={`bg-slate-900 border rounded-xl p-4 flex items-center justify-between ${index === 0 ? 'border-amber-500/50 bg-amber-500/5' : index === 1 ? 'border-slate-400/40' : index === 2 ? 'border-amber-700/40' : 'border-slate-800'}`}>
                  <div className="flex items-center space-x-3">
                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${index === 0 ? 'bg-amber-500 text-slate-950' : index === 1 ? 'bg-slate-300 text-slate-950' : index === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'}`}>
                      #{index + 1}
                    </div>
                    <div>
                      <button onClick={() => onSelectEmployee(emp)} className="font-semibold text-sm text-white hover:underline text-left block">
                        {emp.empName}
                      </button>
                      <span className="text-xs text-slate-400">{emp.center}</span>
                    </div>
                  </div>

                  <div className="text-right">
                    <div className="text-base font-bold font-mono text-indigo-400">
                      {cfg.isPct ? `${val.toFixed(2)}%` : val}
                    </div>
                    {denomVal !== null && <div className="text-[10px] text-slate-500 font-mono">Sample: {denomVal}</div>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // PAGE 6: CENTER-WISE PERFORMANCE
    // ==========================================
    function CenterPerformanceView({ data, onSelectEmployee, onExport }) {
      const centerAggregates = useMemo(() => {
        const map = {};
        data.forEach(emp => {
          const c = emp.center || 'Main Branch';
          if (!map[c]) {
            map[c] = { center: c, staffCount: 0, dialed: 0, connected: 0, effective: 0, walkinsHandled: 0, walkinsConverted: 0, enrolled: 0, eligible: 0 };
          }
          map[c].staffCount++;
          map[c].dialed += emp.overall.dialed;
          map[c].connected += emp.overall.connected;
          map[c].effective += emp.overall.effective;
          map[c].walkinsHandled += emp.overall.walkinsHandled;
          map[c].walkinsConverted += emp.overall.walkinsConverted;
          map[c].enrolled += emp.overall.enrolled;
          map[c].eligible += emp.overall.studEligible;
        });

        return Object.values(map).map(c => ({
          ...c,
          walkinConvPct: c.walkinsHandled > 0 ? (c.walkinsConverted / c.walkinsHandled) * 100 : 0,
          studEligiblePct: c.enrolled > 0 ? (c.eligible / c.enrolled) * 100 : 0
        }));
      }, [data]);

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
            <div>
              <h2 className="text-sm font-semibold text-white">Center-wise Performance Summary</h2>
              <p className="text-xs text-slate-400">Calculated directly from center-level aggregate counts</p>
            </div>
            <button onClick={() => onExport(centerAggregates)} className="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded text-xs font-medium border border-slate-700">
              <i data-lucide="download" className="w-3.5 h-3.5"></i>
              <span>Export Summary</span>
            </button>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left text-slate-300">
                <thead className="bg-slate-950 text-slate-400 uppercase font-mono text-[10px] border-b border-slate-800">
                  <tr>
                    <th className="p-3">Center Name</th>
                    <th className="p-3 text-center">Staff Count</th>
                    <th className="p-3 text-right">Total Dialed</th>
                    <th className="p-3 text-right">Effective Calls</th>
                    <th className="p-3 text-right">Walkins Handled</th>
                    <th className="p-3 text-right">Walkin Conv %</th>
                    <th className="p-3 text-right">Students Enrolled</th>
                    <th className="p-3 text-right">Eligible %</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60 font-mono">
                  {centerAggregates.map((c, i) => (
                    <tr key={i} className="hover:bg-slate-800/40">
                      <td className="p-3 font-sans font-medium text-white">{c.center}</td>
                      <td className="p-3 text-center text-slate-400">{c.staffCount}</td>
                      <td className="p-3 text-right">{c.dialed}</td>
                      <td className="p-3 text-right text-indigo-400">{c.effective}</td>
                      <td className="p-3 text-right">{c.walkinsHandled}</td>
                      <td className="p-3 text-right text-emerald-400 font-semibold">{c.walkinConvPct.toFixed(2)}%</td>
                      <td className="p-3 text-right">{c.enrolled}</td>
                      <td className="p-3 text-right text-amber-400">{c.studEligiblePct.toFixed(2)}%</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // PAGE 7: EMPLOYEE DRILL-DOWN MODAL
    // ==========================================
    function EmployeeDrilldownModal({ emp, rawSheetData, startDate, endDate, onClose }) {
      const [subTab, setSubTab] = useState('calling');

      const empCalling = useMemo(() => {
        return (rawSheetData?.callingDump || []).filter(c => (c["Employee / User"] === emp.callingUser || c["User"] === emp.callingUser));
      }, [rawSheetData, emp]);

      const empWalkins = useMemo(() => {
        return (rawSheetData?.walkins || []).filter(w => (w["user"] === emp.callingUser || w["User"] === emp.callingUser));
      }, [rawSheetData, emp]);

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div className="p-5 border-b border-slate-800 flex items-center justify-between">
              <div>
                <h3 className="text-base font-bold text-white">{emp.empName}</h3>
                <p className="text-xs text-slate-400">{emp.empId} • {emp.center} • {emp.ceEmail}</p>
              </div>
              <button onClick={onClose} className="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <div className="p-4 bg-slate-950 grid grid-cols-4 gap-3 text-center border-b border-slate-800">
              <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                <span className="text-[10px] text-slate-400 block uppercase font-mono">Dialed</span>
                <span className="text-base font-bold font-mono text-white">{emp.overall.dialed}</span>
              </div>
              <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                <span className="text-[10px] text-slate-400 block uppercase font-mono">Walkin Conv %</span>
                <span className="text-base font-bold font-mono text-emerald-400">{emp.overall.walkinConvPct.toFixed(1)}%</span>
              </div>
              <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                <span className="text-[10px] text-slate-400 block uppercase font-mono">Enrolled</span>
                <span className="text-base font-bold font-mono text-amber-400">{emp.overall.enrolled}</span>
              </div>
              <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                <span className="text-[10px] text-slate-400 block uppercase font-mono">ARPU</span>
                <span className="text-base font-bold font-mono text-indigo-400">₹{Math.round(emp.overall.arpu).toLocaleString()}</span>
              </div>
            </div>

            <div className="flex border-b border-slate-800 text-xs px-4">
              <button onClick={() => setSubTab('calling')} className={`py-2.5 px-4 font-medium border-b-2 ${subTab === 'calling' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}`}>
                Calling History ({empCalling.length})
              </button>
              <button onClick={() => setSubTab('walkins')} className={`py-2.5 px-4 font-medium border-b-2 ${subTab === 'walkins' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}`}>
                Walk-in Activity ({empWalkins.length})
              </button>
            </div>

            <div className="flex-1 overflow-auto p-4 text-xs">
              {subTab === 'calling' && (
                <table className="w-full text-left text-slate-300">
                  <thead className="bg-slate-950 text-slate-400 uppercase font-mono text-[10px]">
                    <tr><th className="p-2">Date</th><th className="p-2 text-right">Dialed</th><th className="p-2 text-right">Connected</th><th className="p-2 text-right">Effective</th></tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800 font-mono">
                    {empCalling.map((c, idx) => (
                      <tr key={idx}><td className="p-2">{c.Date}</td><td className="p-2 text-right">{c["Dialed Count"]}</td><td className="p-2 text-right">{c["Connected Count"]}</td><td className="p-2 text-right text-indigo-400">{c["Effective Connected Count"]}</td></tr>
                    ))}
                  </tbody>
                </table>
              )}

              {subTab === 'walkins' && (
                <table className="w-full text-left text-slate-300">
                  <thead className="bg-slate-950 text-slate-400 uppercase font-mono text-[10px]">
                    <tr><th className="p-2">Date</th><th className="p-2">Regno</th><th className="p-2">Class</th><th className="p-2">Status</th></tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800 font-mono">
                    {empWalkins.map((w, idx) => (
                      <tr key={idx}><td className="p-2">{w.Edate || w.Date}</td><td className="p-2">{w.regno || '—'}</td><td className="p-2 font-sans">{w.enClass}</td><td className="p-2"><span className={`px-2 py-0.5 rounded text-[10px] ${w.regno ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>{w.regno ? 'Converted' : 'Unconverted'}</span></td></tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>

            <div className="p-3 bg-slate-950 border-t border-slate-800 flex justify-end">
              <button onClick={onClose} className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-medium">Close</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
