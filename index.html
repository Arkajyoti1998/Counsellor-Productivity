<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admissions Analytics Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .sticky-col { position: sticky; left: 0; background: #0f172a; z-index: 10; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SPREADSHEET_ID = "1kJFF89tvgh8TKJwwwzZW9r5ZMdblZmt_UJi7do4AtuY";
    const DEFAULT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzcUCWJ50aqO1NIuze2bDrhJ8c231dQD6Sm0LjxnxRc_Mv99guU0bgxq5BEDD7St7wg/exec";

    // Flexible Header Matcher (Ignores Case, Spaces, and Underscores)
    function getVal(row, possibleKeys) {
      if (!row) return "";
      const normalizedRow = {};
      Object.keys(row).forEach(k => {
        const cleanKey = k.toLowerCase().replace(/[^a-z0-9]/g, "");
        normalizedRow[cleanKey] = row[k];
      });

      for (let key of possibleKeys) {
        const cleanTarget = key.toLowerCase().replace(/[^a-z0-9]/g, "");
        if (normalizedRow[cleanTarget] !== undefined && normalizedRow[cleanTarget] !== null) {
          return String(normalizedRow[cleanTarget]).trim();
        }
      }
      return "";
    }

    function normalizeDateStr(raw) {
      if (!raw) return "";
      if (typeof raw === 'string' && raw.match(/^\d{4}-\d{2}-\d{2}/)) return raw.substring(0, 10);
      const d = new Date(raw);
      if (!isNaN(d.getTime())) {
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }
      return String(raw).trim();
    }

    async function fetchPublicSheetTab(tabName) {
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
      const res = await fetch(url);
      const text = await res.text();
      const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
      if (lines.length < 2) return [];

      const parseCSVLine = (line) => {
        const matches = [];
        let cur = '', inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') { inQuotes = !inQuotes; }
          else if (c === ',' && !inQuotes) { matches.push(cur.trim()); cur = ''; }
          else { cur += c; }
        }
        matches.push(cur.trim());
        return matches.map(v => v.replace(/^"|"$/g, ''));
      };

      const headers = parseCSVLine(lines[0]);
      return lines.slice(1).map(line => {
        const row = parseCSVLine(line);
        let obj = {};
        headers.forEach((h, idx) => { obj[h] = row[idx] || ""; });
        return obj;
      });
    }

    function App() {
      const [webAppUrl, setWebAppUrl] = useState(() => localStorage.getItem("APPS_SCRIPT_URL") || DEFAULT_WEB_APP_URL);
      const [activeTab, setActiveTab] = useState('overall-prod');
      const [loading, setLoading] = useState(false);
      const [rawSheetData, setRawSheetData] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [statusMsg, setStatusMsg] = useState('');

      const [datePreset, setDatePreset] = useState('ALL');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [selectedCenter, setSelectedCenter] = useState('ALL');
      const [selectedEmployee, setSelectedEmployee] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      const fetchData = async () => {
        setLoading(true);
        setStatusMsg('Fetching latest sheet data...');
        try {
          let dataFetched = null;
          try {
            const res = await fetch(webAppUrl);
            if (res.ok) {
              const result = await res.json();
              if (result.success && result.data) dataFetched = result.data;
            }
          } catch (e) {
            console.warn("Apps Script API failed, fallback to public CSV reader...", e);
          }

          if (!dataFetched) {
            setStatusMsg('Loading directly from Google Sheets...');
            const [teamDetails, callingDump, walkins, b2b, admDetails] = await Promise.all([
              fetchPublicSheetTab("Team Details"),
              fetchPublicSheetTab("Calling Dump"),
              fetchPublicSheetTab("Walkins Handelded"),
              fetchPublicSheetTab("B2b Booked"),
              fetchPublicSheetTab("Adm Details")
            ]);
            dataFetched = { teamDetails, callingDump, walkins, b2b, admDetails };
          }

          setRawSheetData(dataFetched);
          setLastUpdated(new Date().toLocaleTimeString());
          setStatusMsg('');
        } catch (err) {
          setStatusMsg("Failed to connect: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { fetchData(); }, [webAppUrl]);

      const dateDiff = useMemo(() => {
        if (!startDate || !endDate) return 1;
        const s = new Date(startDate);
        const e = new Date(endDate);
        if (isNaN(s.getTime()) || isNaN(e.getTime())) return 1;
        return Math.ceil(Math.abs(e - s) / (1000 * 60 * 60 * 24)) + 1;
      }, [startDate, endDate]);

      const centersList = useMemo(() => {
        if (!rawSheetData?.teamDetails) return [];
        return Array.from(new Set(rawSheetData.teamDetails.map(e => getVal(e, ["Center Name", "Center"])).filter(Boolean)));
      }, [rawSheetData]);

      const employeesList = useMemo(() => {
        if (!rawSheetData?.teamDetails) return [];
        let emps = rawSheetData.teamDetails;
        if (selectedCenter !== 'ALL') {
          emps = emps.filter(e => getVal(e, ["Center Name", "Center"]) === selectedCenter);
        }
        return emps;
      }, [rawSheetData, selectedCenter]);

      const processedMetrics = useMemo(() => {
        if (!rawSheetData) return [];

        return employeesList.map(emp => {
          const empId = getVal(emp, ["Employee ID", "EmployeeID", "ID", "Emp ID"]);
          const empName = getVal(emp, ["Employee Name", "EmployeeName", "Staff Name", "Name"]);
          const ceEmail = getVal(emp, ["CE Email", "Email", "CEEmail"]);
          const callingUser = getVal(emp, ["User / Calling Name", "Calling Name", "User", "CallingUser"]) || empName;
          const sourceName = getVal(emp, ["Source Name", "SourceName", "Source"]) || empName;
          const center = getVal(emp, ["Center Name", "Center", "CenterName"]);

          let dialed = 0, connected = 0, effective = 0, talkTime = 0;
          (rawSheetData.callingDump || []).forEach(row => {
            const d = normalizeDateStr(getVal(row, ["Date"]));
            const u = getVal(row, ["Employee / User", "User", "Calling Name"]);
            if (u === callingUser && (!startDate || d >= startDate) && (!endDate || d <= endDate)) {
              dialed += Number(getVal(row, ["Dialed Count", "Dialed"]) || 0);
              connected += Number(getVal(row, ["Connected Count", "Connected"]) || 0);
              effective += Number(getVal(row, ["Effective Connected Count", "Effective Connected"]) || 0);
              talkTime += Number(getVal(row, ["Talk Time"]) || 0);
            }
          });

          let walkinsHandled = 0, walkinsConverted = 0;
          (rawSheetData.walkins || []).forEach(row => {
            const d = normalizeDateStr(getVal(row, ["Edate", "Date"]));
            const u = getVal(row, ["user", "User"]);
            if (u === callingUser && (!startDate || d >= startDate) && (!endDate || d <= endDate)) {
              walkinsHandled++;
              if (getVal(row, ["regno", "Registration"])) walkinsConverted++;
            }
          });

          let b2bBooked = 0, b2bConverted = 0;
          (rawSheetData.b2b || []).forEach(row => {
            const formDate = normalizeDateStr(getVal(row, ["Form Filled Date"]));
            const emailMatch = getVal(row, ["CE Email", "Email"]) === ceEmail;
            if (emailMatch && formDate && (!startDate || formDate >= startDate) && (!endDate || formDate <= endDate)) {
              b2bBooked++;
              if (getVal(row, ["Conversion Check"]).toLowerCase() === 'yes') b2bConverted++;
            }
          });

          let enrolled = 0, studEligible = 0, feesEligible = 0, arpuTotal = 0, arpuCount = 0;
          (rawSheetData.admDetails || []).forEach(row => {
            const joinDate = normalizeDateStr(getVal(row, ["joining_date", "Date"]));
            const srcMatch = getVal(row, ["source_name", "Source"]) === sourceName;

            if (srcMatch && joinDate && (!startDate || joinDate >= startDate) && (!endDate || joinDate <= endDate)) {
              enrolled++;
              if (getVal(row, ["eligibility_status"]).toLowerCase() === 'eligible') studEligible++;
              if (getVal(row, ["Fees_Eligible"]).toLowerCase() === 'eligible') feesEligible++;

              const notLessReg = getVal(row, ["ay27_enrollment_status"]) !== 'Less than Registration';
              const notFree = getVal(row, ["free_admission"]).toLowerCase() !== 'true';

              if (notLessReg && notFree && getVal(row, ["arpu_check"]).toLowerCase() === 'yes') {
                arpuTotal += Number(getVal(row, ["arpu"]) || 0);
                arpuCount++;
              }
            }
          });

          const walkinConvPct = walkinsHandled > 0 ? (walkinsConverted / walkinsHandled) * 100 : 0;
          const b2bConvPct = b2bBooked > 0 ? (b2bConverted / b2bBooked) * 100 : 0;
          const feesEligiblePct = enrolled > 0 ? (feesEligible / enrolled) * 100 : 0;
          const arpu = arpuCount > 0 ? arpuTotal / arpuCount : 0;

          return {
            empId, empName, ceEmail, center,
            overall: { dialed, connected, walkinsHandled, walkinConvPct, b2bBooked, b2bConvPct, enrolled, feesEligiblePct, arpu },
            average: { dialed: dialed / dateDiff, connected: connected / dateDiff, walkinsHandled: walkinsHandled / dateDiff, walkinConvPct, b2bBooked: b2bBooked / dateDiff, b2bConvPct, enrolled: enrolled / dateDiff, feesEligiblePct, arpu }
          };
        });
      }, [rawSheetData, employeesList, startDate, endDate, dateDiff]);

      const filtered = useMemo(() => {
        let list = processedMetrics;
        if (selectedEmployee !== 'ALL') list = list.filter(m => m.empId === selectedEmployee);
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(m => m.empName.toLowerCase().includes(q) || m.empId.toLowerCase().includes(q));
        }
        return list;
      }, [processedMetrics, selectedEmployee, searchQuery]);

      return (
        <div className="flex h-screen overflow-hidden bg-slate-950 text-slate-100">
          <aside className="w-64 bg-slate-900 border-r border-slate-800 p-4 space-y-4">
            <h1 className="font-bold text-sm text-white">Admissions Dashboard</h1>
            <nav className="space-y-1 text-xs">
              <button onClick={() => setActiveTab('avg-prod')} className={`w-full text-left p-2.5 rounded ${activeTab === 'avg-prod' ? 'bg-indigo-600 text-white font-medium' : 'text-slate-400 hover:bg-slate-800'}`}>Average Productivity</button>
              <button onClick={() => setActiveTab('overall-prod')} className={`w-full text-left p-2.5 rounded ${activeTab === 'overall-prod' ? 'bg-indigo-600 text-white font-medium' : 'text-slate-400 hover:bg-slate-800'}`}>Overall Productivity</button>
            </nav>
          </aside>

          <main className="flex-1 flex flex-col overflow-hidden">
            <header className="bg-slate-900 border-b border-slate-800 p-4 flex flex-wrap gap-3 items-center justify-between">
              <div className="flex gap-3 text-xs">
                <div>
                  <label className="block text-slate-400 mb-1">Center</label>
                  <select value={selectedCenter} onChange={e => setSelectedCenter(e.target.value)} className="bg-slate-950 border border-slate-800 rounded p-1.5 text-white">
                    <option value="ALL">All Centers</option>
                    {centersList.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">Search</label>
                  <input type="text" placeholder="Filter by name..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="bg-slate-950 border border-slate-800 rounded p-1.5 text-white" />
                </div>
              </div>
              <button onClick={fetchData} className="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded text-xs">Refresh</button>
            </header>

            <div className="flex-1 overflow-auto p-6">
              {loading ? (
                <div className="text-center py-12 text-slate-400 text-xs">Loading spreadsheet data...</div>
              ) : (
                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-x-auto">
                  <table className="w-full text-xs text-left text-slate-300">
                    <thead className="bg-slate-950 text-slate-400 uppercase text-[10px]">
                      <tr>
                        <th className="p-3">Employee Name</th>
                        <th className="p-3">ID</th>
                        <th className="p-3">Center</th>
                        <th className="p-3">Dialed</th>
                        <th className="p-3">Connected</th>
                        <th className="p-3">Walkins</th>
                        <th className="p-3">Walkin Conv %</th>
                        <th className="p-3">B2B Booked</th>
                        <th className="p-3">Fees Eligible %</th>
                        <th className="p-3">ARPU</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {filtered.map((m, i) => {
                        const s = activeTab === 'avg-prod' ? m.average : m.overall;
                        return (
                          <tr key={i} className="hover:bg-slate-800/50">
                            <td className="p-3 font-medium text-white">{m.empName || "—"}</td>
                            <td className="p-3 font-mono text-slate-400">{m.empId || "—"}</td>
                            <td className="p-3">{m.center || "—"}</td>
                            <td className="p-3 font-mono">{activeTab === 'avg-prod' ? s.dialed.toFixed(2) : s.dialed}</td>
                            <td className="p-3 font-mono">{activeTab === 'avg-prod' ? s.connected.toFixed(2) : s.connected}</td>
                            <td className="p-3 font-mono">{activeTab === 'avg-prod' ? s.walkinsHandled.toFixed(2) : s.walkinsHandled}</td>
                            <td className="p-3 font-mono text-emerald-400">{s.walkinConvPct.toFixed(2)}%</td>
                            <td className="p-3 font-mono">{activeTab === 'avg-prod' ? s.b2bBooked.toFixed(2) : s.b2bBooked}</td>
                            <td className="p-3 font-mono text-indigo-400">{s.feesEligiblePct.toFixed(2)}%</td>
                            <td className="p-3 font-mono">₹{Math.round(s.arpu).toLocaleString()}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
